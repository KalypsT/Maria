name: Déploiement DomoThib

# Le build de DomoThib Games (D-193, `docs/domothib.md` §7.2), à côté du workflow de GitHub Pages
# (`deploy.yml`) jusqu'à la bascule (G2 bis). Une PR construit et vérifie le build. Le déploiement
# vers l'hôte des jeux (dossier `maria`) part quand le workflow de GitHub Pages a réussi sur `main` :
# ses tests (≈ 1 h) ne sont pas refaits ici. À la bascule, quand `deploy.yml` disparaît, remettre
# typecheck, lint, format et tests dans ce workflow et le déclencher sur `push` vers `main`.
on:
  pull_request:
  workflow_run:
    workflows: ['CI et déploiement GitHub Pages']
    types: [completed]
    branches: [main]
  # Redéployer `main` à la main (sans refaire les tests).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domothib-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:domothib
      - run: npm run check:domothib
      - name: Envoi sur l'hôte des jeux
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          SSH_KEY: ${{ secrets.JEUX_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jeux && chmod 600 ~/.ssh/jeux
          rsync -rlz --delete-after --delay-updates --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/jeux" dist/ "jeux-deploy@$VPS_HOST:./"
